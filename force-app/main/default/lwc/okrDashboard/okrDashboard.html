<template>
    <lightning-card title="OKR Dashboard">

        <div class="dashboard-container">

            <h1>OKR Dashboard</h1>

            <p>Track your objectives and key results.</p>

            <div class="slds-m-top_medium">

                <lightning-button
                    label="New Objective"
                    variant="brand"
                    onclick={handleNewObjective}>
                </lightning-button>

                <lightning-button
                    label="New Key Result"
                    variant="neutral"
                    class="slds-m-left_small"
                    onclick={handleNewKeyResult}>
                </lightning-button>

            </div>

            <template if:true={isLoading}>

                <div class="slds-text-align_center slds-p-around_medium">

                    <lightning-spinner
                        alternative-text="Loading Objectives">
                    </lightning-spinner>

                    <p>Loading Objectives...</p>

                </div>

            </template>

            <template if:false={isLoading}>

                <template if:true={objectives.length}>

                    <div class="slds-m-top_medium">

                        <template
                            for:each={objectives}
                            for:item="objective">

                            <div
                                key={objective.Id}
                                class="slds-box slds-m-bottom_medium">

                                <h2 class="slds-text-heading_medium">
                                    {objective.Name}
                                </h2>

                                <p class="slds-m-top_small">
                                    <strong>Year:</strong>
                                    {objective.Objective_Year__c}
                                </p>

                                <p class="slds-m-top_x-small">
                                    <strong>Assigned User:</strong>
                                    {objective.Assigned_User__r.Name}
                                </p>

                                <div class="slds-m-top_medium">

                                    <h3 class="slds-text-heading_small">
                                        Key Results
                                    </h3>

                                    <template if:true={objective.keyResults.length}>

                                        <template
                                            for:each={objective.keyResults}
                                            for:item="keyResult">

                                            <div
                                                key={keyResult.Id}
                                                class="slds-box slds-m-top_small">

                                                <h4 class="slds-text-heading_small">
                                                    {keyResult.Name}
                                                </h4>

                                                <p class="slds-m-top_small">
                                                    <strong>Target:</strong>
                                                    {keyResult.Target__c}
                                                </p>

                                                <p class="slds-m-top_x-small">
                                                    <strong>Completed:</strong>
                                                    {keyResult.Completed_Target__c}
                                                </p>

                                                <p class="slds-m-top_x-small">
                                                    <strong>Measurement Type:</strong>
                                                    {keyResult.Measurement_Type__c}
                                                </p>

                                                <p class="slds-m-top_x-small">
                                                    <strong>Measurement Criteria:</strong>
                                                    {keyResult.Measurement_Criteria__c}
                                                </p>

                                            </div>

                                        </template>

                                    </template>

                                    <template if:false={objective.keyResults.length}>

                                        <p class="slds-m-top_small">
                                            No Key Results yet.
                                        </p>

                                    </template>

                                </div>

                            </div>

                        </template>

                    </div>

                </template>

                <template if:false={objectives.length}>

                    <div class="empty-state slds-text-align_center">

                        <h2>No objectives yet</h2>

                        <p>Your objectives will appear here.</p>

                    </div>

                </template>

            </template>

        </div>

    </lightning-card>

    <template if:true={showObjectiveForm}>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header class="slds-modal__header">

                    <h2 class="slds-text-heading_medium">
                        New Objective
                    </h2>

                </header>

                <div class="slds-modal__content slds-p-around_medium">

                    <lightning-record-edit-form
                        object-api-name="Objective__c"
                        onsuccess={handleObjectiveSuccess}
                        onerror={handleError}>

                        <lightning-messages></lightning-messages>

                        <lightning-input-field
                            field-name="Name"
                            required>
                        </lightning-input-field>

                        <lightning-input-field
                            field-name="Assigned_User__c"
                            required>
                        </lightning-input-field>

                        <lightning-input-field
                            field-name="Objective_Year__c"
                            required>
                        </lightning-input-field>

                        <div class="slds-grid slds-grid_align-end slds-m-top_medium">

                            <lightning-button
                                label="Cancel"
                                onclick={handleCancel}>
                            </lightning-button>

                            <lightning-button
                                type="submit"
                                label="Save"
                                variant="brand"
                                class="slds-m-left_small">
                            </lightning-button>

                        </div>

                    </lightning-record-edit-form>

                </div>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

    <template if:true={showKeyResultForm}>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header class="slds-modal__header">

                    <h2 class="slds-text-heading_medium">
                        New Key Result
                    </h2>

                </header>

                <div class="slds-modal__content slds-p-around_medium">

                    <lightning-record-edit-form
                        object-api-name="Key_Result__c"
                        onsuccess={handleKeyResultSuccess}
                        onerror={handleError}>

                        <lightning-messages></lightning-messages>

                        <lightning-input-field
                            field-name="Name"
                            required>
                        </lightning-input-field>

                        <lightning-input-field
                            field-name="Objective__c"
                            required>
                        </lightning-input-field>

                        <lightning-input-field
                            field-name="Target__c"
                            required>
                        </lightning-input-field>

                        <lightning-input-field
                            field-name="Completed_Target__c">
                        </lightning-input-field>

                        <lightning-input-field
                            field-name="Measurement_Type__c"
                            required>
                        </lightning-input-field>

                        <lightning-input-field
                            field-name="Measurement_Criteria__c"
                            required>
                        </lightning-input-field>

                        <div class="slds-grid slds-grid_align-end slds-m-top_medium">

                            <lightning-button
                                label="Cancel"
                                onclick={handleCancel}>
                            </lightning-button>

                            <lightning-button
                                type="submit"
                                label="Save"
                                variant="brand"
                                class="slds-m-left_small">
                            </lightning-button>

                        </div>

                    </lightning-record-edit-form>

                </div>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

</template>
